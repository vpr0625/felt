    <p class="muted small" id="lg-name-note"></p><p class="err" id="lg-err" role="alert"></p></div>`, { backdropCloses: false });
  }
}
let pendingLeague = null, lgEditing = null;
function openCreate() {
  openSheet(`<div class="sheet-head"><button class="link" data-a="close">Cancel</button><h2>Start a league</h2><button class="link strong" data-a="lg-create-do">Start</button></div>
  <div class="sheet-body"><label class="field"><span>League name</span><input type="text" id="lg-lname" autocapitalize="sentences" autocomplete="off" autocorrect="off" spellcheck="false" name="felt-league-name" maxlength="32" placeholder="Friday Night League" enterkeyhint="next"></label>
  <label class="field"><span>Your name in this league</span><input type="text" id="lg-name" value="${esc(lastPlayer())}" autocapitalize="words" autocomplete="off" autocorrect="off" spellcheck="false" name="felt-player" maxlength="24" placeholder="What your friends call you" enterkeyhint="done"></label>
  <p class="muted small">You’ll get a code to share with your friends so they can join.</p><p class="err" id="lg-err" role="alert"></p></div>`, { backdropCloses: false });
}
function openResultForm(r) {
  lgEditing = r ? r.id : null;
  const last = sortedAsc().filter(s => !s.sample).pop();
  const v = r ? { date: r.date, buyIn: (r.buyIn / 100).toFixed(2), out: (r.cashOut / 100).toFixed(2) } : { date: todayISO(), buyIn: '', out: '' };
  openSheet(`<div class="sheet-head"><button class="link" data-a="close">Cancel</button><h2>${r ? 'Edit result' : 'Add my result'}</h2><button class="link strong" data-a="lg-save">Save</button></div>
  <div class="sheet-body"><form id="lgf" novalidate>
    ${!r && last ? `<button type="button" class="chip" data-a="lg-use-last" data-date="${last.date}" data-in="${last.buyIn}" data-out="${last.stack}" style="margin-bottom:14px">Use my last session: ${fmtDate(last.date, false)}, ${usdC(net(last), true)}</button>` : ''}
    <label class="field"><span>Game night</span><input type="date" id="lg-date" value="${v.date}"></label>
    <div class="two">
      <label class="field"><span>Total buy-in</span><div class="money"><i>$</i><input type="text" id="lg-in" inputmode="decimal" value="${v.buyIn}" placeholder="0.00"></div></label>
      <label class="field"><span>Cashed out</span><div class="money"><i>$</i><input type="text" id="lg-out" inputmode="decimal" value="${v.out}" placeholder="0.00"></div></label>
    </div>
    <p class="calc" id="lg-calc" aria-live="polite"></p><p class="err" id="lg-err" role="alert"></p>
    ${r ? `<div class="stack-btns"><button type="button" class="btn danger" data-a="lg-del" data-id="${esc(r.id)}">Delete result</button></div>` : ''}
  </form></div>`, { backdropCloses: false });
  lgCalc();
}
function lgCalc() {
  const a = parseMoney($('#lg-in') && $('#lg-in').value), b = parseMoney($('#lg-out') && $('#lg-out').value), el = $('#lg-calc');
  if (el) el.innerHTML = a != null && b != null ? `Net result ${moneyHTML((b - a) / 100)}.` : '';
}
function openResult(id) {
  const r = LGD.results.find(x => x.id === id); if (!r) return;
  const mine = r.uid === LGD.uid, organizer = LGD.league && LGD.league.createdBy === LGD.uid;
  const names = new Map(LGD.members.map(m => [m.id, m.name]));
  const who = Object.entries(r.reactions || {}).map(([u, e]) => `${e} ${esc(u === LGD.uid ? 'You' : names.get(u) || 'Someone')}`);
  openSheet(`<div class="sheet-head"><span></span><h2>${esc(r.player)}</h2><button class="link strong" data-a="close">Done</button></div>
  <div class="sheet-body"><div class="muted small">${fmtDate(r.date)}</div>
    <div class="live-stats det-stats"><div class="ls"><span class="ls-l">In</span><span class="ls-v">${usdC(r.buyIn)}</span></div><div class="ls"><span class="ls-l">Out</span><span class="ls-v">${usdC(r.cashOut)}</span></div><div class="ls"><span class="ls-l">Net</span><span class="ls-v ${signCls(lgNet(r) / 100)}">${usdC(lgNet(r), true)}</span></div></div>
    <p class="label">React</p>
    <div class="rx-pick" role="group" aria-label="React">${REACTIONS.map(e => `<button data-a="lg-react" data-id="${esc(r.id)}" data-v="${e}" aria-pressed="${(r.reactions || {})[LGD.uid] === e}">${e}</button>`).join('')}</div>
    ${who.length ? `<p class="muted small rx-who">${who.join(', ')}</p>` : ''}
    ${mine ? `<div class="stack-btns"><button class="btn" data-a="lg-edit" data-id="${esc(r.id)}">Edit my result</button></div>` : organizer ? `<div class="stack-btns"><button class="btn danger" data-a="lg-del" data-id="${esc(r.id)}">Remove this result</button></div><p class="muted small">You started this league, so you can remove results that were added by mistake.</p>` : ''}
  </div>`);
}
function openPlayer(name) {
  const list = LGD.results.filter(r => key(r.player) === key(name)).sort((a, b) => a.date < b.date ? 1 : -1);
  openSheet(`<div class="sheet-head"><span></span><h2>${esc(name)}</h2><button class="link strong" data-a="close">Done</button></div>
  <div class="sheet-body"><table class="bt list"><tbody>${list.map(r => `<tr data-a="lg-result" data-id="${esc(r.id)}" tabindex="0"><td class="date">${fmtDate(r.date, false)}</td><td><div class="sub">In ${usdC(r.buyIn)}, out ${usdC(r.cashOut)}</div>${reactionChips(r)}</td><td class="num">${moneyHTML(lgNet(r) / 100)}</td></tr>`).join('')}</tbody></table></div>`);
}
async function postLeagueResult(date, buyIn, cashOut, lg = S.league) {
  const be = await lgBackend();
  await be.addResult(lg.code, { date, buyIn, cashOut, player: lg.player });
}
// In the session form, pre-select the league linked to this session type (until you pick one yourself).
let lgPicked = false;
function pickLeagueFor(type) {
  const sel = $('#f-league'); if (!sel || lgPicked) return;
  const k = key(type || ''), hit = S.leagues.find(l => l.type && key(l.type) === k);
  sel.value = hit ? hit.code : '';
}
const lgFail = m => { const e = $('#lg-err'); if (e) e.textContent = m; };
const MAX_C = 10000000;   // $100,000, the same limit the security rules use
function lgWrite(fn, okMsg) {
  if (okMsg) toast(navigator.onLine === false ? `${okMsg} It’ll sync when you’re back online.` : okMsg);
  return lgBackend().then(fn).catch(e => toast(e && e.code === 'permission-denied' ? 'The league didn’t accept that change. Try rejoining the league.' : 'Couldn’t reach the league. Check your connection and try again.'));
}
let lgDupOk = '';
Object.assign(A, {
  'lg-view': t => { lgView = t.dataset.v; renderLeague(); },
  'lg-switch-open': () => openSwitcher(),
  'lg-switch': t => { S.leagueCur = t.dataset.code; save(); closeSheet(); lgStart(); renderLeague(); window.scrollTo(0, 0); },
  'lg-join-open': () => openJoin('code', pendingLeague ? pendingLeague.code : ''),
  'lg-create-open': () => openCreate(),
  'lg-join-check': async () => {
    const code = $('#lg-code').value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length !== 6) return lgFail('Enter the 6-character league code.');
    lgFail('Checking…');
    try {
      const be = await lgBackend(), lg = await be.getLeague(code);
      if (!lg) return lgFail('There’s no league with that code. Check it and try again.');
      if (S.leagues.some(l => l.code === code)) { S.leagueCur = code; save(); closeSheet(); lgStart(); renderLeague(); toast(`You’re already in ${lg.name}.`); return; }
      pendingLeague = lg; openJoin('name');
    } catch (e) { lgFail('Couldn’t reach the league. Check your connection and try again.'); }
  },
  'lg-join-do': async () => {
    const name = $('#lg-name').value.trim().replace(/\s+/g, ' ');
    if (!name) return lgFail('Enter your name.');
    try {
      const be = await lgBackend(); await be.setMember(pendingLeague.code, name);
      S.league = { code: pendingLeague.code, name: pendingLeague.name, player: name }; S.settings.playerName = name; save();
      closeSheet(); lgStart(); renderLeague(); toast(`You joined ${pendingLeague.name}.`); pendingLeague = null;
    } catch (e) { lgFail('Couldn’t join right now. Check your connection and try again.'); }
  },
  'lg-create-do': async () => {
    const lname = $('#lg-lname').value.trim().replace(/\s+/g, ' '), name = $('#lg-name').value.trim().replace(/\s+/g, ' ');
    if (!lname) return lgFail('Give your league a name.');
    if (!name) return lgFail('Enter your name.');
    lgFail('Starting your league…');
    try {
      const be = await lgBackend();
      let code = lgCode();
      for (let i = 0; i < 4 && await be.getLeague(code); i++) code = lgCode();
      await be.createLeague(code, lname); await be.setMember(code, name);
      S.league = { code, name: lname, player: name }; S.settings.playerName = name; save();
      closeSheet(); lgStart(); renderLeague(); A['lg-share']();
    } catch (e) { lgFail('Couldn’t start the league. Check your connection and try again.'); }
  },
  'lg-share': async () => {
    const lg = S.league; if (!lg) return;
    const url = location.origin + location.pathname;
    const text = `Join my poker league “${lg.name}” on Felt. Open ${url}, add it to your home screen, go to the League tab and enter code ${lg.code}.`;
    try { if (navigator.share) { await navigator.share({ text }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    if (await copyText(text)) toast(`Invite copied. League code: ${lg.code}`);
    else messageSheet('Invite your friends', esc(text));
  },
  'lg-add': () => openResultForm(null),
  'lg-use-last': t => { $('#lg-date').value = t.dataset.date; $('#lg-in').value = (t.dataset.in / 100).toFixed(2); $('#lg-out').value = (t.dataset.out / 100).toFixed(2); lgCalc(); },
  'lg-save': async () => {
    const date = $('#lg-date').value, buyIn = parseMoney($('#lg-in').value), cashOut = parseMoney($('#lg-out').value);
    if (!isISO(date)) return lgFail('Enter the date of the game night.');
    if (buyIn == null) return lgFail('Enter your total buy-in, including rebuys.');
    if (cashOut == null) return lgFail('Enter how much you cashed out. Enter 0 if you lost it all.');
    if (buyIn > MAX_C || cashOut > MAX_C) return lgFail('Amounts over $100,000 aren’t supported.');
    if (!lgEditing && lgDupOk !== date && LGD.results.some(r => r.uid === LGD.uid && r.date === date)) { lgDupOk = date; return lgFail(`You already added a result for ${fmtDate(date)}. Tap Save again if this is a second game that night.`); }
    const code = S.league.code, editing = lgEditing, rec = { date, buyIn, cashOut, player: S.league.player };
    lgEditing = null; lgDupOk = ''; closeSheet();
    lgWrite(be => editing ? be.updateResult(code, editing, rec) : be.addResult(code, rec), editing ? 'Result updated.' : `Added to ${S.league.name}.`);
  },
  'lg-result': t => openResult(t.dataset.id),
  'lg-player': t => openPlayer(t.dataset.name),
  'lg-edit': t => openResultForm(LGD.results.find(x => x.id === t.dataset.id)),
  'lg-del': t => { const code = S.league.code, id = t.dataset.id; closeSheet(); lgWrite(be => be.deleteResult(code, id), 'Result deleted.'); },
  'lg-rejoin': async () => {
    try { const be = await lgBackend(); await be.setMember(S.league.code, S.league.player); LGD.rejoin = false; lgStart(); renderLeague(); toast(`You’re back in ${S.league.name}.`); }
    catch (e) { toast('Couldn’t rejoin right now. Check your connection and try again.'); }
  },
  'lg-rename': () => {
    const name = $('#lg-rename').value.trim().replace(/\s+/g, ' ');
    if (!name || name === S.league.player) return;
    const code = S.league.code, ids = LGD.results.filter(r => r.uid === LGD.uid).map(r => r.id);
    S.league.player = name; S.settings.playerName = name; save(); renderLeague();
    lgWrite(async be => { await be.setMember(code, name); await be.renamePlayer(code, ids, name); }, `You’re now ${name} in this league.`);
  },
  'lg-react': async t => {
    const r = LGD.results.find(x => x.id === t.dataset.id); if (!r) return;
    const cur = (r.reactions || {})[LGD.uid], next = cur === t.dataset.v ? null : t.dataset.v;
    r.reactions = { ...(r.reactions || {}) }; if (next) r.reactions[LGD.uid] = next; else delete r.reactions[LGD.uid];
    openResult(r.id);
    const code = S.league.code; lgWrite(be => be.react(code, r.id, next));
  },
  'lg-leave': () => {
    const mine = LGD.results.filter(r => r.uid === LGD.uid).length;
    openSheet(`<div class="sheet-head"><button class="link" data-a="close">Cancel</button><h2>Leave league</h2><span></span></div>
    <div class="sheet-body"><p>You’ll stop seeing ${esc(S.league.name)} on this phone. You can rejoin anytime with code <b>${esc(S.league.code)}</b>.</p>
    ${mine ? `<label class="switch"><input type="checkbox" id="lg-wipe"><span><b>Also delete my ${mine} result${mine === 1 ? '' : 's'}</b><br><span class="muted small">Your results disappear from the standings and game nights for everyone. Past nights may no longer add up to $0. This can’t be undone.</span></span></label>`
      : '<p class="muted small">You haven’t added any results to this league.</p>'}
    <div class="stack-btns"><button class="btn danger" data-a="lg-leave-confirm">Leave league</button><button class="btn" data-a="close">Stay</button></div></div>`);
  },
  'lg-leave-confirm': async () => {
    const code = S.league && S.league.code, wipe = $('#lg-wipe') && $('#lg-wipe').checked;
    const gone = S.league ? S.league.name : 'the league';
    try {
      const be = await lgBackend();
      if (code && wipe) await be.deleteResults(code, LGD.results.filter(r => r.uid === LGD.uid).map(r => r.id));
      if (code) await be.removeMember(code);
    } catch (e) { if (wipe) { toast('Couldn’t delete your results. Check your connection and try again.'); return; } }
    S.league = null; save(); lgStart(); closeSheet(); renderLeague(); toast(wipe ? `You left ${gone} and deleted your results.` : `You left ${gone}.`);
  },
  'lg-forget': () => { S.league = null; save(); lgStart(); renderLeague(); toast('Removed from this phone.'); },
  'lg-delete': () => {
    const lg = S.league, nights = new Set(LGD.results.map(r => r.date)).size;
    openSheet(`<div class="sheet-head"><button class="link" data-a="close">Cancel</button><h2>Delete league</h2><span></span></div>
    <div class="sheet-body"><p>This permanently deletes <b>${esc(lg.name)}</b> for everyone: ${LGD.results.length} result${LGD.results.length === 1 ? '' : 's'} from ${nights} game night${nights === 1 ? '' : 's'}, all reactions, and its ${LGD.members.length} member${LGD.members.length === 1 ? '' : 's'}. This can’t be undone.</p>
    <label class="field"><span>Type the league name to confirm</span><input type="text" id="lg-del-name" autocomplete="off" autocapitalize="off" placeholder="${esc(lg.name)}"></label>
    <p class="err" id="lg-err" role="alert"></p>
    <div class="stack-btns"><button class="btn danger" data-a="lg-delete-confirm">Delete league for everyone</button><button class="btn" data-a="close">Keep the league</button></div></div>`, { backdropCloses: false });
  },
  'lg-delete-confirm': async () => {
    const lg = S.league;
    if (key($('#lg-del-name').value) !== key(lg.name)) return lgFail(`Type ${lg.name} exactly to confirm.`);
    lgFail('Deleting…');
    try {
      const be = await lgBackend();
      await be.deleteLeague(lg.code, LGD.results.map(r => r.id), LGD.members.map(m => m.id));
      S.league = null; save(); lgStart(); closeSheet(); renderLeague(); toast(`Deleted ${lg.name}.`);
    } catch (e) { lgFail('Couldn’t delete the league. Check your connection and try again.'); }
  },
  // Add button: a menu, or straight back to a session in progress
  add: () => {
    if (S.live) { setTab('live'); return; }
    openSheet(`<div class="sheet-head"><button class="link" data-a="close">Cancel</button><h2>Add</h2><span></span></div>
    <div class="sheet-body"><div class="add-menu">
      <button class="add-opt" data-a="add-live"><b>Start a live session</b><span class="muted small">Track buy-ins and hands while you play</span></button>
      <button class="add-opt" data-a="add-done"><b>Log a finished session</b><span class="muted small">Enter your buy-in and ending stack</span></button>
    </div></div>`);
  },
  'add-live': () => { closeSheet(); setTab('live'); },
  'add-done': () => openSessionForm(),
});
document.addEventListener('input', e => { if (e.target.closest && e.target.closest('#lgf')) lgCalc(); });

/* ---------------- start ---------------- */
load();
applyTheme();
render();
syncWakeLock();
lgStart();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (tab === 'analytics' && $('#results')) renderResults(); else if (tab === 'home') drawHome(); });
</script>

// Offline support: only on the real website (https), never in previews.
if ('serviceWorker' in navigator && location.protocol === 'https:' && window.top === window.self) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
