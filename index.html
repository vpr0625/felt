<style>
:root {
  --paper: #ffffff; --sheet: #ffffff; --ink: #000000; --ink2: #5a5f66; --hair: #e2e2e2; --field: #f4f5f6; --fieldline: #d4d6d9;
  --win: #1fa463; --loss: #e5483d; --win-t: #12804a; --loss-t: #c22f25;
  --purple: #9467bd; --orange: #f28a1a; --blue: #2f6fe4; --scrim: rgba(0,0,0,.32); --press: #eef0f2;
  --card: #fafafb; --grid: #ececee; --heat: 47 111 228; --accent: #000000; --on-accent: #ffffff; --heat-ink: #ffffff;
  --cell-o: #f0f1f3; --cell-s: #e3edf8; --cell-p: #ebe5f4;
  --font: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #16181c; --sheet: #1e2126; --ink: #f1f1ee; --ink2: #a4a9b0; --hair: #30343a; --field: #24272d; --fieldline: #3b4047;
    --win: #34d17f; --loss: #ff6359; --win-t: #4fdc91; --loss-t: #ff7d74;
    --purple: #a98bd1; --orange: #ffa245; --blue: #5b98ff; --scrim: rgba(0,0,0,.55); --press: #262a30;
    --card: #1b1e23; --grid: #2a2e35; --heat: 91 152 255; --accent: #f1f1ee; --on-accent: #16181c;
    --cell-o: #23262c; --cell-s: #1f2e40; --cell-p: #2d2839;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #16181c; --sheet: #1e2126; --ink: #f1f1ee; --ink2: #a4a9b0; --hair: #30343a; --field: #24272d; --fieldline: #3b4047;
  --win: #34d17f; --loss: #ff6359; --win-t: #4fdc91; --loss-t: #ff7d74;
  --purple: #a98bd1; --orange: #ffa245; --blue: #5b98ff; --scrim: rgba(0,0,0,.55); --press: #262a30;
    --card: #1b1e23; --grid: #2a2e35; --heat: 91 152 255; --accent: #f1f1ee; --on-accent: #16181c;
    --cell-o: #23262c; --cell-s: #1f2e40; --cell-p: #2d2839;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 64px); }
body { margin: 0; background: var(--paper); color: var(--ink); font: 500 16px/1.45 var(--font); font-variant-numeric: tabular-nums; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.pos { color: var(--win-t); }
.neg { color: var(--loss-t); }

/* header and tab bar */
.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) 10px 8px 20px; background: var(--paper); border-bottom: 1px solid var(--hair); }
.top h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
.icon { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; border-radius: 12px; }
.icon:active { background: var(--press); }
.icon svg { width: 24px; height: 24px; }
main { max-width: 720px; margin: 0 auto; padding: 14px 20px calc(env(safe-area-inset-bottom, 0px) + 104px); }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--paper); border-top: 1px solid var(--hair); padding: 4px 8px calc(env(safe-area-inset-bottom, 0px) + 4px); }
.tabs button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0 4px;
  font-size: 12px; color: var(--ink2); min-height: 52px; }
.tabs button[aria-current="page"] { color: var(--ink); }
.tabs button[aria-current="page"] span:last-child { font-weight: 700; }
.tabs svg { width: 24px; height: 24px; }
.tabs .plus { width: 42px; height: 24px; border-radius: 12px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.tabs .plus svg { width: 20px; height: 20px; }
.tabs .add { color: var(--ink); }

/* text */
h2 { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; margin: 34px 0 10px; }
.lede { font-size: 17px; margin: 4px 0 6px; }
.note { color: var(--ink2); }
.muted { color: var(--ink2); }
.small { font-size: 15px; }
.warn { border: 1px solid var(--loss-t); color: var(--ink); border-radius: 12px; padding: 10px 14px; font-size: 15px; margin: 4px 0 14px; }

/* booktabs tables */
table.bt { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums;
  border-top: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); }
table.bt th { font-weight: 600; color: var(--ink2); font-size: 13px; text-align: left; padding: 7px 6px 6px; border-bottom: 1px solid var(--hair); }
table.bt td { padding: 9px 6px; vertical-align: top; }
table.bt tbody tr:first-child td { padding-top: 12px; }
table.bt tbody tr:last-child td { padding-bottom: 12px; }
table.bt th:first-child, table.bt td:first-child { padding-left: 0; }
table.bt th:last-child, table.bt td:last-child { padding-right: 0; }
.num { text-align: right !important; white-space: nowrap; }
.year h2 { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.year h2 .ynet { font-size: 16px; font-weight: 600; }
table.list td.date { white-space: nowrap; width: 4.4em; }
table.list .ty { overflow-wrap: anywhere; }
table.list .sub { font-size: 14px; color: var(--ink2); margin-top: 1px; }
table.list tbody tr { cursor: pointer; }
table.list tbody tr:active td { background: var(--press); }
table.list tbody tr:focus-visible { outline-offset: -2px; }
table.stats td:last-child { text-align: right; white-space: nowrap; }
table.stats td .sub { font-size: 13px; color: var(--ink2); margin-top: 1px; }

/* empty state */
.empty { padding: 40px 0 10px; }
.empty p:first-child { font-size: 20px; font-weight: 700; margin: 0 0 6px; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }

/* buttons and fields */
.btn { min-height: 46px; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--ink); background: transparent; font-size: 16px; }
.btn:active { background: var(--press); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.danger { border-color: var(--loss-t); color: var(--loss-t); }
.btn[disabled] { opacity: .4; cursor: default; }
.btn.wide { width: 100%; }
.link { border: 0; background: none; padding: 10px 12px; min-height: 44px; font-size: 17px; }
.link.strong { font-weight: 700; }
.btn, .link, .chip, .seg button, .toc button { font-weight: 600; }
.link.inline { padding: 0; min-height: 0; text-decoration: underline; text-underline-offset: 2px; font-size: inherit; }
.field { display: block; margin: 0 0 16px; }
.field > span, .label { display: block; font-size: 15px; color: var(--ink2); margin-bottom: 5px; }
input[type="text"], input[type="date"], input:not([type]), select, textarea {
  width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid var(--fieldline); border-radius: 12px;
  background: var(--field); font-size: 17px; -webkit-appearance: none; appearance: none; }
input[type="date"] { display: block; text-align: left; }
input[type="date"]::-webkit-date-and-time-value { text-align: left; }
textarea { min-height: 160px; font-size: 14px; line-height: 1.35; resize: vertical; }
.select { position: relative; }
.select::after { content: ""; position: absolute; right: 16px; top: 50%; width: 8px; height: 8px; margin-top: -6px;
  border-right: 1.6px solid var(--ink2); border-bottom: 1.6px solid var(--ink2); transform: rotate(45deg); pointer-events: none; }
.select select { padding-right: 40px; }
.money { position: relative; }
.money i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-style: normal; color: var(--ink2); pointer-events: none; }
.money input { padding-left: 26px; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.two > * { min-width: 0; }
input { min-width: 0; max-width: 100%; }
.stepper { display: grid; grid-template-columns: 46px 1fr 46px; border: 1px solid var(--fieldline); border-radius: 12px; overflow: hidden; background: var(--field); }
.stepper button { border: 0; background: none; font-size: 22px; line-height: 1; min-height: 44px; }
.stepper button:active { background: var(--press); }
.stepper input { border: 0 !important; border-radius: 0 !important; text-align: center; padding: 8px 0 !important; min-height: 44px; background: transparent !important; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.chip { border: 1px solid var(--fieldline); background: transparent; border-radius: 999px; padding: 6px 13px; font-size: 15px; min-height: 36px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.hint { margin: -8px 0 14px; }
.unit { position: relative; }
.unit input { padding-right: 46px; }
.unit i { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-style: normal; color: var(--ink2); pointer-events: none; }
textarea#f-notes, textarea#live-notes { min-height: 84px; font-size: 16px; line-height: 1.4; font-family: inherit; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .02em; color: var(--ink2); border: 1px solid var(--fieldline); border-radius: 6px; padding: 0 5px; vertical-align: 2px; }
.note-line { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 1; line-clamp: 1; overflow: hidden; overflow-wrap: anywhere; }
#f-same:empty { display: none; }
.calc { margin: 2px 0 10px; font-size: 16px; min-height: 1.4em; }
.err { color: var(--loss-t); font-size: 15px; margin: 0 0 12px; min-height: 0; }
.err:empty { display: none; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--fieldline); border-radius: 12px; overflow: hidden; }
.seg button { border: 0; background: none; min-height: 44px; font-size: 16px; }
.seg button + button { border-left: 1px solid var(--fieldline); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
.stack-btns { display: grid; gap: 10px; margin-top: 18px; }

/* sheet */
.backdrop { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
.backdrop[hidden] { display: none; }
.sheet { background: var(--sheet); width: 100%; max-width: 560px; max-height: 92%; border-radius: 18px 18px 0 0; display: flex; flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom, 0px); animation: up .22s ease-out; }
.sheet:focus { outline: none; }
@keyframes up { from { transform: translateY(32px); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.sheet-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 6px 6px; border-bottom: 1px solid var(--hair); }
.sheet-head h2 { margin: 0; font-size: 17px; text-align: center; }
.sheet-head > :first-child { justify-self: start; }
.sheet-head > :last-child { justify-self: end; }
.sheet-body { overflow-y: auto; overscroll-behavior: contain; padding: 18px 20px 22px; -webkit-overflow-scrolling: touch; }
.sheet-body h3 { font-size: 17px; margin: 4px 0 10px; }
.sheet-body h3:not(:first-child) { margin-top: 26px; }
.sheet-body > p:first-child { margin-top: 0; }
.backdrop.kb .sheet { max-height: 100%; padding-bottom: 0; }

/* analytics */
.filters { padding: 4px 0 0; }
.filters .field { margin-bottom: 12px; }
.scope { margin: 2px 0 0; font-size: 16px; }
.toc { display: flex; gap: 8px; overflow-x: auto; margin: 14px -20px 0; padding: 2px 20px 4px; scrollbar-width: none; }
.toc::-webkit-scrollbar { display: none; }
.toc button { flex: none; border: 1px solid var(--fieldline); background: none; border-radius: 999px; padding: 6px 13px; font-size: 15px; min-height: 36px; }
section.an { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 66px); }
figure { margin: 6px 0 0; }
.chart { width: 100%; }
.chart svg { display: block; width: 100%; height: auto; touch-action: pan-y; -webkit-user-select: none; user-select: none; overflow: visible; }
figcaption { text-align: center; font-size: 13px; color: var(--ink2); line-height: 1.4; margin: 8px auto 0; max-width: 34em; }
.readout { font-size: 14px; text-align: center; color: var(--ink); min-height: 2.8em; margin-top: 6px; line-height: 1.38; }
.readout b { color: var(--ink); font-weight: 700; }
.window { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; font-size: 16px; }
.window .stepper { width: 150px; }
svg text { font-family: var(--font); font-size: 12px; font-weight: 500; fill: var(--ink); }
svg .lab { font-size: 13px; font-weight: 600; }
svg .sub { font-size: 12px; font-weight: 500; fill: var(--ink2); }
svg .val { font-size: 12px; font-weight: 700; }
svg .axl { font-size: 11px; fill: var(--ink2); font-variant-numeric: tabular-nums; }
svg .tpos { fill: var(--win-t); }
svg .tneg { fill: var(--loss-t); }
.grid { stroke: var(--grid); stroke-width: 1; }
.zero { stroke: var(--ink2); stroke-opacity: .55; stroke-width: 1; }
.ln { fill: none; stroke-width: 2.25; stroke-linejoin: round; stroke-linecap: round; }
.pos-f { fill: var(--win); } .neg-f { fill: var(--loss); }
.pos-s { stroke: var(--win); } .neg-s { stroke: var(--loss); }
.end-dot { stroke: var(--card); stroke-width: 2; }
.hist-bar { fill-opacity: .88; }
.mean { stroke: var(--ink); stroke-opacity: .7; stroke-width: 1.5; stroke-dasharray: 3 3; }
.pill { fill: var(--ink); }
svg .pill-t { fill: var(--paper); font-size: 11px; font-weight: 700; }
.dd-line { stroke: var(--loss); }
.box { fill: var(--blue); fill-opacity: .16; stroke: var(--blue); stroke-width: 1.5; }
.median { stroke: var(--ink); stroke-width: 2.5; stroke-linecap: round; }
.whisk { stroke: var(--ink2); stroke-width: 1.25; stroke-linecap: round; }
.flier { fill: none; stroke: var(--ink2); stroke-width: 1.25; }
.guide { stroke: var(--ink2); stroke-width: 1; stroke-dasharray: 3 3; }
.hdot { fill: var(--card); stroke-width: 2.5; }
.hsel { fill: var(--ink); fill-opacity: .05; }
.vpip-line { stroke: var(--blue); } .pfr-line { stroke: var(--orange); }
.vpip-f { fill: var(--blue); } .pfr-f { fill: var(--orange); } .vpip-s { stroke: var(--blue); }
figure { background: var(--card); border: 1px solid var(--hair); border-radius: 16px; padding: 14px 12px 12px; }
figure .readout { margin-top: 8px; }

/* live session */
.tabs .ico { position: relative; display: block; width: 24px; height: 24px; }
.tabs .dot { position: absolute; top: -1px; right: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--win); border: 2px solid var(--paper); }
.tabs .dot[hidden] { display: none; }
.live-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 2px 0 12px; }
.live-title { min-width: 0; }
.live-head .btn { white-space: nowrap; flex: none; padding: 10px 14px; }
.live-type { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.live-stats { display: grid; grid-template-columns: 1.25fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.ls { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 9px 12px; border-radius: 12px; background: var(--field); border: 1px solid var(--fieldline); text-align: left; min-width: 0; }
button.ls:active { background: var(--press); }
.ls-l { font-size: 12.5px; color: var(--ink2); font-weight: 600; }
.ls-v { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
.ls-add { position: absolute; top: 6px; right: 8px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-size: 16px; line-height: 1; font-weight: 700; }
.pick-label { font-size: 15px; min-height: 1.5em; margin: 0 0 8px; }
.hgrid { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 2px; margin: 0 -10px; }
.hc { aspect-ratio: 1; min-width: 0; border: 0; border-radius: 4px; padding: 0; font: 600 clamp(8px, 2.6vw, 11.5px)/1 -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif; /* system font keeps Q distinct from O at this size */ letter-spacing: -0.04em; color: var(--ink); background: var(--cell-o); }
.hc.pair { background: var(--cell-p); }
.hc.suited { background: var(--cell-s); }
.hgrid.pick .hc[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.hgrid.heat .hc { background: rgb(var(--heat) / var(--p)); }
.hgrid.heat .hc.dark { color: var(--heat-ink); }
.hgrid.heat .hc.none { background: transparent; box-shadow: inset 0 0 0 1px var(--hair); color: var(--ink2); }
.hgrid.heat .hc.sel { box-shadow: inset 0 0 0 2px var(--ink); }
.acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px -20px 6px; padding: 8px 20px; position: sticky; bottom: calc(env(safe-area-inset-bottom, 0px) + 63px); z-index: 3; background: var(--paper); }
.act { min-height: 54px; border-radius: 12px; border: 1px solid var(--fieldline); background: transparent; font-weight: 700; font-size: 15px; padding: 0 4px; }
.act:active { background: var(--press); }
.act-r { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.center { text-align: center; }
.recent-head { display: flex; align-items: baseline; justify-content: space-between; margin-top: 22px; }
.recent-head h2 { margin: 0 0 6px; font-size: 17px; }
table.hands td { padding-top: 7px; padding-bottom: 7px; }
.live-foot { margin-top: 26px; display: grid; gap: 14px; }
.switch { display: flex; align-items: center; gap: 12px; font-size: 15px; }
.switch input { width: 22px; height: 22px; accent-color: var(--ink); flex: none; }
.add-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
tr.total td { border-top: 1px solid var(--hair); }
.seg.two-up { grid-template-columns: 1fr 1fr; margin: 4px 0 14px; }
.seg.four { grid-template-columns: repeat(4, 1fr); }
.seg.four button { font-size: 14px; }
.label { font-size: 15px; color: var(--ink2); margin: 0 0 8px; }
.legend-row { font-size: 13.5px; color: var(--ink2); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 0 0 4px; }
.key { display: inline-block; width: 16px; height: 0; border-top: 3px solid var(--blue); border-radius: 2px; margin-left: 6px; }
.key:first-child { margin-left: 0; }
.key.k-pfr { border-color: var(--orange); }

.pos-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 6px; }
.pos-head .label { margin: 0; }
.stepper.small { grid-template-columns: 36px auto 36px; border-radius: 10px; }
.stepper.small button { min-height: 34px; font-size: 18px; }
.stepper.small output { display: grid; place-items: center; padding: 0 6px; font-size: 14px; font-weight: 600; white-space: nowrap; }
.pos-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-bottom: 10px; }
.seat { min-height: 36px; border-radius: 9px; border: 1px solid var(--fieldline); background: transparent; font-weight: 700; font-size: 13.5px; padding: 0; }
.seat[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.pos-hint { margin: -4px 0 10px; }
.live-notes { margin-top: 22px; }

table.bt tr.subhead th { font-weight: 600; color: var(--ink2); font-size: 13px; text-align: left; padding: 16px 0 6px; border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
table.bt tr.subhead th.num { text-align: right; }
table.bt tr.subhead + tr td { padding-top: 12px; }
/* session detail, list filter, backup */
.det-title { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.det-stats { margin: 14px 0 12px; }
.det-stats .ls-v { font-size: 17px; white-space: nowrap; }
.det-notes { white-space: pre-wrap; background: var(--field); border-radius: 12px; padding: 10px 12px; margin: 0 0 12px; font-size: 15px; }
.list-filter { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; margin: 2px 0 10px; }
.list-filter .select { max-width: 46vw; }
.list-filter select { min-height: 44px; }
input[type="search"] { width: 100%; min-height: 44px; padding: 9px 12px; border: 1px solid var(--fieldline); border-radius: 12px; background: var(--field); font-size: 16px; -webkit-appearance: none; appearance: none; }
.res-prompt { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: -2px 0 10px; font-size: 15px; }
.res-prompt span { margin-right: 2px; }
.bk-card { border: 1px solid var(--fieldline); background: var(--field); border-radius: 14px; padding: 12px 14px; margin: 2px 0 14px; }
.bk-card p { margin: 4px 0 0; }
.bk-card .btns { margin-top: 10px; }
.bk-card .btn { min-height: 40px; padding: 8px 14px; }
#bk-text { min-height: 140px; font-size: 13px; }

/* header spade: emerald in light mode, ivory in dark mode */
.top h1 { display: flex; align-items: center; gap: 9px; }
.logo { display: none; flex: none; height: 26px; }
.with-logo .logo { display: inline-flex; }
.logo img { height: 26px; width: auto; display: block; }
.logo-dark { display: none !important; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .logo-light { display: none !important; } :root:not([data-theme="light"]) .logo-dark { display: block !important; } }
:root[data-theme="dark"] .logo-light { display: none !important; }
:root[data-theme="dark"] .logo-dark { display: block !important; }
/* colorblind option */
.cb-switch { margin-top: 14px; align-items: flex-start; }
.cb-switch input { margin-top: 2px; }

/* league and add menu */
.tabs .add .live-pill { display: none; }
.tabs .add.is-live .plus { display: none; }
.tabs .add.is-live .live-pill { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 10px; border-radius: 12px; background: var(--win); color: #fff; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tabs .add.is-live .live-pill i { width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .tabs .add.is-live .live-pill i { animation: none; } }
.tabs .add[aria-current] span:last-child { font-weight: 700; }
.add-menu { display: grid; gap: 10px; }
.add-opt { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--fieldline); background: var(--field); }
.add-opt:active { background: var(--press); }
.add-opt b { font-size: 17px; }
.lg-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 2px 0 14px; }
.lg-title { min-width: 0; }
.lg-switcher { border: 0; background: none; padding: 4px 6px 4px 0; text-align: left; border-radius: 10px; }
.lg-switcher:active { background: var(--press); }
.chev { display: inline-block; width: 8px; height: 8px; margin: 0 0 4px 4px; border-right: 2px solid var(--ink2); border-bottom: 2px solid var(--ink2); transform: rotate(45deg); }
.add-opt.cur { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.code { letter-spacing: .08em; }
.code-in { text-transform: uppercase; letter-spacing: .2em; font-size: 22px !important; text-align: center; }
table.standings td.rank { width: 1.8em; font-weight: 700; color: var(--ink2); }
section.night h2 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 17px; margin-top: 26px; }
.zs { margin-top: 8px; }
.warn-text { color: var(--loss-t); }
.rx { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
.rx-chip { font-size: 13px; padding: 1px 8px; border-radius: 999px; background: var(--field); border: 1px solid var(--fieldline); }
.rx-chip.mine { border-color: var(--accent); }
.rx-pick { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.rx-pick button { font-size: 24px; min-height: 50px; border-radius: 12px; border: 1px solid var(--fieldline); background: transparent; }
.rx-pick button[aria-pressed="true"] { border-color: var(--accent); background: var(--field); box-shadow: inset 0 0 0 1px var(--accent); }
.rx-who { margin-top: 10px; }
.lg-switch { margin: 4px 0 12px; }
.nw { white-space: nowrap; }

/* home */
figure.compact { padding: 12px 12px 8px; }
.home-chart { margin-top: 16px; }
.fig-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 0 2px 6px; }
.fig-label { font-size: 13px; font-weight: 700; color: var(--ink2); text-transform: uppercase; letter-spacing: .06em; }
figure.compact .readout { min-height: 2.6em; margin-top: 4px; font-size: 13px; }
.home-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 4px 0 8px; }
.home-stats .ls-v { font-size: clamp(15px, 4.6vw, 19px); white-space: nowrap; }
.home-note { margin: 0 0 4px; }
.home-btns { margin-top: 26px; }
.home-btns .btn { flex: 1 1 0; }
.live-card { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; margin: 2px 0 14px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--win); background: var(--field); }
.live-card:active { background: var(--press); }
.lc-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--win); flex: none; }
.lc-text { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.lc-text b { overflow-wrap: anywhere; }
.lc-go { font-weight: 700; flex: none; }

/* toast */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 78px); z-index: 30;
  width: min(92vw, 480px); background: var(--ink); color: var(--paper); border-radius: 14px; padding: 10px 8px 10px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 16px; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
.toast[hidden] { display: none; }
.toast span { padding: 4px 0; }
.toast .link { color: var(--paper); font-weight: 700; padding: 6px 10px; min-height: 36px; }
</style>
</head>

const defaultSettings = () => ({ cb: false, playerName: '', toLeague: true, theme: 'system', window: 10, keepAwake: true, anView: 'results', players: 9, filters: { type: '', start: '', end: '' } });
const S = { sessions: [], seq: 0, live: null, leagues: [], leagueCur: '', backupAt: 0, backupSnooze: 0, settings: defaultSettings() };
// S.league is the league currently shown. Setting it adds or switches to that league; setting null leaves the current one.
Object.defineProperty(S, 'league', {
  get() { return S.leagues.find(l => l.code === S.leagueCur) || S.leagues[0] || null; },
  set(v) {
    if (v) { const i = S.leagues.findIndex(l => l.code === v.code); if (i >= 0) S.leagues[i] = { ...S.leagues[i], ...v }; else S.leagues.push(v); S.leagueCur = v.code; }
    else { const cur = S.league; S.leagues = S.leagues.filter(l => l !== cur); S.leagueCur = S.leagues[0] ? S.leagues[0].code : ''; }
  },
});
let tab = 'home';

function isISO(s) {
  if (typeof s !== 'string') return false;
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if (!m) return false;
  const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
  return d.getUTCFullYear() === +m[1] && d.getUTCMonth() === +m[2] - 1 && d.getUTCDate() === +m[3];
}
function validStored(s) {
  return s && typeof s.id === 'string' && isISO(s.date) && typeof s.type === 'string' && s.type.trim() !== '' &&
    Number.isInteger(s.stack) && s.stack >= 0 && Number.isInteger(s.buyIn) && s.buyIn >= 0;
}
// Earlier versions saved a per-buy-in amount and a count. Fold them into one total buy-in.
function upgrade(s) {
  if (!s || typeof s !== 'object' || s.n === undefined) return s;
  const { n, ...rest } = s;
  if (Number.isInteger(n) && n >= 1 && Number.isInteger(s.buyIn)) rest.buyIn = s.buyIn * n;
  return rest;
}
function load() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { storageOK = false; return; }
  if (!raw) return;
  try {
    const d = JSON.parse(raw);
    ingest(d);
    S.backupAt = Number.isFinite(d.backupAt) ? d.backupAt : 0;
    S.backupSnooze = Number.isFinite(d.backupSnooze) ? d.backupSnooze : 0;
  } catch (e) {
    try { localStorage.setItem(KEY + '-unreadable-' + Date.now(), raw); } catch (_) {}
  }
}
// Reads saved data (from this device or a backup) into the app, keeping only values it understands.
function ingest(d) {
  {
    if (Array.isArray(d.sessions)) S.sessions = d.sessions.map(upgrade).filter(validStored).map(s => {
      if (!s.id) s = { ...s, id: uid() };
      const o = { ...s, seq: Number.isFinite(s.seq) ? s.seq : 0 }, h = cleanHands(s.hands);
      if (h) o.hands = h; else delete o.hands;
      delete o.mins;   // session length is no longer tracked
      if (typeof o.notes === 'string' && o.notes.trim()) o.notes = o.notes.slice(0, 2000); else delete o.notes;
      return o;
    });
    S.live = cleanLive(d.live);
    const okL = lg => lg && /^[A-Z0-9]{6}$/.test(lg.code) && typeof lg.player === 'string' && lg.player.trim();
    const cleanL = lg => { const o = { code: lg.code, name: String(lg.name || 'League').slice(0, 32), player: lg.player.slice(0, 24) }; if (typeof lg.type === 'string' && lg.type) o.type = lg.type.slice(0, 60); return o; };
    const list = Array.isArray(d.leagues) ? d.leagues : d.league ? [d.league] : [];   // older saves had a single league
    S.leagues = list.filter(okL).map(cleanL).filter((l, i, a) => a.findIndex(x => x.code === l.code) === i);
    S.leagueCur = S.leagues.some(l => l.code === d.leagueCur) ? d.leagueCur : (S.leagues[0] ? S.leagues[0].code : '');
    S.seq = Math.max(Number(d.seq) || 0, 0, ...S.sessions.map(s => s.seq));
    const st = d.settings;
    if (st && typeof st === 'object') {
      if (['system', 'light', 'dark'].includes(st.theme)) S.settings.theme = st.theme;
      if (typeof st.cb === 'boolean') S.settings.cb = st.cb;
      if (typeof st.playerName === 'string') S.settings.playerName = st.playerName.slice(0, 24);
      if (typeof st.toLeague === 'boolean') S.settings.toLeague = st.toLeague;
      const w = parseInt(st.window, 10); if (w >= 1 && w <= 500) S.settings.window = w;
      if (typeof st.keepAwake === 'boolean') S.settings.keepAwake = st.keepAwake;
      if (st.anView === 'preflop') S.settings.anView = 'preflop';
      if (Number.isInteger(st.players) && st.players >= 3 && st.players <= 10) S.settings.players = st.players;
      const fl = st.filters || {};
      S.settings.filters = { type: typeof fl.type === 'string' ? fl.type : '', start: isISO(fl.start) ? fl.start : '', end: isISO(fl.end) ? fl.end : '' };
    }
  }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify({ v: 1, seq: S.seq, sessions: S.sessions, live: S.live, leagues: S.leagues, leagueCur: S.leagueCur, settings: S.settings, backupAt: S.backupAt, backupSnooze: S.backupSnooze })); storageOK = true; }
  catch (e) { storageOK = false; }
}
function uid() {
  try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}

const net = s => s.stack - s.buyIn;                // cents
const totalIn = s => s.buyIn;                       // cents
const key = t => String(t).trim().toLowerCase();
const pad2 = n => String(n).padStart(2, '0');
const iso = (y, m, d) => `${y}-${pad2(m)}-${pad2(d)}`;
function todayISO() { const d = new Date(); return iso(d.getFullYear(), d.getMonth() + 1, d.getDate()); }
const tms = s => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
function fmtDate(s, year = true) { return MONTHS[+s.slice(5, 7) - 1] + ' ' + (+s.slice(8, 10)) + (year ? ', ' + s.slice(0, 4) : ''); }

function usd(dollars, sign = false, dec = 2) {
  const c = Math.round(dollars * Math.pow(10, dec) + (dollars < 0 ? -1e-7 : 1e-7)); // round halves away from zero
  const body = '$' + (Math.abs(c) / Math.pow(10, dec)).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
  if (c === 0) return body;
  return c < 0 ? MINUS + body : (sign ? '+' + body : body);
}
const usdC = (c, sign = false) => usd(c / 100, sign);
const signCls = dollars => { const c = Math.round(dollars * 100 + (dollars < 0 ? -1e-7 : 1e-7)); return c > 0 ? 'pos' : c < 0 ? 'neg' : ''; };
const moneyHTML = (dollars, sign = true) => `<span class="${signCls(dollars)}">${usd(dollars, sign)}</span>`;
function parseMoney(v) {
  v = String(v == null ? '' : v).replace(/[$,\s]/g, '');
  if (!/^(\d+\.?\d*|\.\d+)$/.test(v)) return null;
  return Math.round(parseFloat(v) * 100);
}

function sortedAsc(list = S.sessions) {
  return list.slice().sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.seq - b.seq);
}
function typeInfo() {
  const m = new Map();
  for (const s of sortedAsc()) {
    const k = key(s.type);
    const e = m.get(k) || { name: '', count: 0, last: '' };
    e.name = s.type.trim(); e.count++; e.last = s.date;
    m.set(k, e);
  }
  return m;
}
const typesByRecent = () => [...typeInfo().values()].sort((a, b) => a.last < b.last ? 1 : a.last > b.last ? -1 : b.count - a.count);
const typesAlpha = () => [...typeInfo().values()].sort((a, b) => a.name.localeCompare(b.name));
function sameDay(date, type, exceptId) {
  const k = key(type);
  return S.sessions.find(s => s.id !== exceptId && s.date === date && key(s.type) === k);
}
function filtered() {
  const f = S.settings.filters, k = key(f.type);
  return sortedAsc().filter(s => (!f.type || key(s.type) === k) && (!f.start || s.date >= f.start) && (!f.end || s.date <= f.end));
}

/* ---------------- shell ---------------- */
function warnHTML() {
  return storageOK ? '' : `<p class="warn" role="status">This copy of the app can’t save data, so sessions you add will be gone when you close it. Open Felt from your home screen to keep them.</p>`;
}
function render() {
  $('#title-wrap').classList.toggle('with-logo', tab === 'home');
  $('#title').textContent = { home: 'Felt', sessions: 'Sessions', live: 'Live Session', league: 'League', analytics: 'Analytics' }[tab];
  updateLiveDot();
  document.querySelectorAll('.tabs [data-tab]').forEach(b => { if (b.dataset.tab === tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  if (tab === 'home') { $('#main').innerHTML = homeHTML(); drawHome(); }
  else if (tab === 'sessions') $('#main').innerHTML = sessionsHTML();
  else if (tab === 'live') $('#main').innerHTML = liveHTML();
  else if (tab === 'league') $('#main').innerHTML = leagueHTML();
  else { $('#main').innerHTML = analyticsHTML(); renderResults(); }
}
function setTab(t) { tab = t; render(); window.scrollTo(0, 0); }

/* ---------------- sessions list ---------------- */
function sessionRow(s, withYear = false) {
  return `<tr data-a="detail" data-id="${esc(s.id)}" tabindex="0" aria-label="${esc(s.type)} on ${fmtDate(s.date)}">
    <td class="date">${fmtDate(s.date, withYear && s.date.slice(0, 4) !== todayISO().slice(0, 4))}</td>
    <td><div class="ty">${esc(s.type)}${s.sample ? ' <span class="tag">Sample</span>' : ''}</div><div class="sub">In ${usdC(totalIn(s))}, out ${usdC(s.stack)}${s.hands ? `, ${s.hands.length} hand${s.hands.length === 1 ? '' : 's'}` : ''}</div>${s.notes ? `<div class="sub note-line">${esc(s.notes)}</div>` : ''}</td>
    <td class="num">${moneyHTML(net(s) / 100)}</td></tr>`;
}

/* ---------------- home ---------------- */
function homeHTML() {
  const all = sortedAsc(), L = S.live;
  const liveCard = L ? `<button class="live-card" data-a="tab" data-tab="live">
      <span class="lc-dot" aria-hidden="true"></span>
      <span class="lc-text"><b>${esc(L.type)} in progress</b><span class="muted small">${usdC(liveTotal(L))} in, ${L.hands.length} hand${L.hands.length === 1 ? '' : 's'} logged</span></span>
      <span class="lc-go">Return</span></button>` : '';
  if (!all.length) {
    return warnHTML() + liveCard + `<div class="empty"><p>Welcome to Felt</p><p class="muted">Log sessions to see your results here. Track a session live while you play, add one you’ve already finished, or import past sessions from a CSV file.</p>
      <div class="btns">${L ? '' : '<button class="btn primary" data-a="tab" data-tab="live">Start a live session</button>'}<button class="btn" data-a="add">Add a session</button><button class="btn" data-a="import">Import CSV file</button></div>
      <p class="muted small" style="margin-top:18px">Just looking around? <button class="link inline" data-a="sample-add">Add sample sessions</button> to see how everything looks.</p></div>`;
  }
  const total = all.reduce((a, s) => a + net(s), 0) / 100;
  const yr = todayISO().slice(0, 4), thisYear = all.filter(s => s.date.slice(0, 4) === yr);
  const yrTotal = thisYear.reduce((a, s) => a + net(s), 0) / 100;
  const wins = all.filter(s => net(s) > 0).length;
  const last = all[all.length - 1];
  // current streak of winning or losing sessions
  let streak = 0, dir = 0;
  for (let i = all.length - 1; i >= 0; i--) { const d = Math.sign(net(all[i])); if (!d) break; if (!dir) dir = d; if (d !== dir) break; streak++; }
  const recent = all.slice(-5).reverse();
  return warnHTML() + liveCard + backupCardHTML() + `
  <div class="home-stats">
    <div class="ls"><span class="ls-l">All time</span><span class="ls-v ${signCls(total)}">${usd(total, true)}</span></div>
    <div class="ls"><span class="ls-l">${yr}</span><span class="ls-v ${signCls(yrTotal)}">${thisYear.length ? usd(yrTotal, true) : '—'}</span></div>
    <div class="ls"><span class="ls-l">Win rate</span><span class="ls-v">${pct(wins / all.length, 0)}</span></div>
  </div>
  <p class="home-note muted small">${all.length} session${all.length === 1 ? '' : 's'}. Last played ${fmtDate(last.date)}.${streak >= 2 ? ` You’ve ${dir > 0 ? 'won' : 'lost'} your last ${streak} sessions.` : ''}</p>
  <section class="an home-chart">
    <figure id="home-cum" class="compact" ><div class="fig-head"><span class="fig-label">Profit over time</span></div>
      <div class="chart" data-h="150"></div><div class="readout" aria-live="polite"></div></figure></section>
  <section class="an"><div class="recent-head"><h2>Recent sessions</h2><button class="link" data-a="tab" data-tab="sessions">See all</button></div>
    <table class="bt list"><tbody>${recent.map(s => sessionRow(s, true)).join('')}</tbody></table></section>
  ${L ? '' : `<div class="btns home-btns"><button class="btn primary" data-a="tab" data-tab="live">Start a live session</button><button class="btn" data-a="add">Add a session</button></div>`}`;
}
function drawHome() {
  const fig = $('#home-cum'); if (!fig) return;
  try { drawCum(fig, sortedAsc()); } catch (e) { fig.querySelector('.chart').innerHTML = '<p class="note">This chart couldn’t be drawn.</p>'; }
  lastWidth = window.innerWidth;
}
function sessionsHTML() {
  const all = sortedAsc();
  if (!all.length) {
    return warnHTML() + `<div class="empty"><p>No sessions yet</p><p class="muted">Log your first session, or import your past sessions from a CSV file.</p>
      <div class="btns"><button class="btn primary" data-a="add">Add a session</button><button class="btn" data-a="import">Import CSV file</button></div></div>`;
  }
  const types = typesAlpha();
  if (listType && !types.some(t => key(t.name) === key(listType))) listType = '';
  return warnHTML() + `<div class="list-filter">
    <input type="search" id="lf-q" value="${esc(listQ)}" placeholder="Search sessions" aria-label="Search sessions and notes" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
    ${types.length > 1 ? `<div class="select"><select id="lf-type" aria-label="Session type"><option value="">All types</option>${types.map(t => `<option value="${esc(t.name)}"${key(t.name) === key(listType) ? ' selected' : ''}>${esc(t.name)}</option>`).join('')}</select></div>` : ''}
  </div><div id="list-body">${listBody()}</div>`;
}

/* ---------------- sheet ---------------- */
let sheetCloseOnBackdrop = true, lastFocus = null;
function openSheet(html, { backdropCloses = true } = {}) {
  const bd = $('#backdrop'), sh = $('#sheet');
  lastFocus = document.activeElement;
  sh.innerHTML = html; bd.hidden = false; sheetCloseOnBackdrop = backdropCloses;
  $('#toast').hidden = true; undoFn = null; clearTimeout(toastTimer);
  sh.focus({ preventScroll: true });
  fitSheet();
}
function closeSheet() {
  const bd = $('#backdrop');
  bd.hidden = true; $('#sheet').innerHTML = '';
  bd.style.top = bd.style.height = bd.style.bottom = ''; bd.classList.remove('kb');
  if (lastFocus && lastFocus.focus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
  if (tab === 'league' && typeof renderLeague === 'function') renderLeague();   // show league changes that arrived while a panel was open
}
// iPhone doesn't shrink the page for the keyboard, so fit the panel to the part of the screen that's still visible.
function fitSheet() {
  const bd = $('#backdrop'), vv = window.visualViewport;
  if (!vv || bd.hidden) return;
  const kb = window.innerHeight - vv.height > 80;
  bd.style.top = kb ? vv.offsetTop + 'px' : '';
  bd.style.height = kb ? vv.height + 'px' : '';
  bd.style.bottom = kb ? 'auto' : '';
  bd.classList.toggle('kb', kb);
}
if (window.visualViewport) { visualViewport.addEventListener('resize', fitSheet); visualViewport.addEventListener('scroll', fitSheet); }
function messageSheet(title, body) {
  openSheet(`<div class="sheet-head"><span></span><h2>${esc(title)}</h2><button class="link strong" data-a="close">OK</button></div>
    <div class="sheet-body"><p>${body}</p></div>`);
}

/* ---------------- add / edit ---------------- */
let editing = null;
let endingLive = false;
function openSessionForm(id, fromLive = false) {
  lgPicked = false;
  const ex = id ? S.sessions.find(s => s.id === id) : null;
  editing = ex ? ex.id : null;
  endingLive = !!(fromLive && S.live && !ex);
  const recent = typesByRecent(), L = endingLive ? S.live : null;
  const v = ex ? { date: ex.date, type: ex.type, buyIn: (ex.buyIn / 100).toFixed(2), stack: (ex.stack / 100).toFixed(2), notes: ex.notes || '' }
    : L ? { date: L.date, type: L.type, buyIn: L.buyIns.length ? (liveTotal(L) / 100).toFixed(2) : '', stack: '', notes: L.notes || '' }
    : { date: todayISO(), type: recent[0] ? recent[0].name : '', buyIn: '', stack: '', notes: '' };
  const nh = ex && ex.hands ? ex.hands.length : L ? L.hands.length : 0;
  const chips = recent.slice(0, 8).map(t => `<button type="button" class="chip" data-a="chip" data-name="${esc(t.name)}" aria-pressed="false">${esc(t.name)}</button>`).join('');
  openSheet(`<div class="sheet-head"><button class="link" data-a="close">Cancel</button><h2>${ex ? 'Edit session' : L ? 'End session' : 'New session'}</h2><button class="link strong" data-a="save-session">Save</button></div>
  <div class="sheet-body"><form id="sf" novalidate>
    <label class="field"><span>Date</span><input type="date" id="f-date" value="${v.date}" max="2100-12-31"></label>
    <div class="field"><span id="l-type">Session type</span>
      ${chips ? `<div class="chips" role="group" aria-labelledby="l-type">${chips}</div>` : ''}
      <input type="text" id="f-type" value="${esc(v.type)}" autocomplete="off" autocapitalize="sentences" autocorrect="off" spellcheck="false" name="felt-f-type" enterkeyhint="next" aria-labelledby="l-type" placeholder="Home game, casino, league…" maxlength="60">
    </div>
    <div class="two">
      <label class="field"><span>Total buy-in</span><div class="money"><i>$</i><input type="text" id="f-buyin" inputmode="decimal" value="${v.buyIn}" placeholder="0.00" enterkeyhint="next"></div></label>
      <label class="field"><span>Ending stack</span><div class="money"><i>$</i><input type="text" id="f-stack" inputmode="decimal" value="${v.stack}" placeholder="0.00" enterkeyhint="done"></div></label>
    </div>
    <p class="hint muted small">${L ? (L.buyIns.length ? 'This is the total of the buy-ins you logged. Change it if you missed one.' : 'You didn’t log any buy-ins, so enter your total here.') : 'Add up every buy-in and rebuy from the session.'}</p>
    ${nh ? `<p class="muted small">${nh} hand${nh === 1 ? '' : 's'} ${L ? 'will be saved with this session' : 'were recorded during this session'}.</p>` : ''}
    <label class="field"><span>Notes (optional)</span><textarea id="f-notes" rows="3" maxlength="2000" placeholder="Table dynamics, how you played, anything to remember">${esc(v.notes)}</textarea></label>
    ${!ex && S.leagues.length && lgConfigured() ? `<label class="field"><span>Also add to a league</span><div class="select"><select id="f-league"><option value="">Don’t add to a league</option>${S.leagues.map(l => `<option value="${l.code}">${esc(l.name)}</option>`).join('')}</select></div></label>` : ''}
    <p class="calc" id="f-calc" aria-live="polite"></p>
    <p class="muted small" id="f-same" aria-live="polite"></p>
    <p class="err" id="f-err" role="alert"></p>
    ${ex ? `<div class="stack-btns"><button type="button" class="btn danger wide" data-a="delete-session">Delete session</button></div>` : ''}
  </form></div>`, { backdropCloses: false });
  pickLeagueFor(v.type); updateForm();
}
function readForm() {
  const date = $('#f-date').value, type = $('#f-type').value.trim().replace(/\s+/g, ' ');
  const buyIn = parseMoney($('#f-buyin').value), stack = parseMoney($('#f-stack').value);
  return { date, type, buyIn, stack, notes: $('#f-notes').value.trim() };
}
function updateForm() {
  if (!$('#sf')) return;
  const v = readForm();
  document.querySelectorAll('#sf .chip').forEach(c => c.setAttribute('aria-pressed', String(key(c.dataset.name) === key(v.type) && v.type !== '')));
  let calc = '';
  if (v.buyIn != null && v.stack != null) calc = `Net result ${moneyHTML((v.stack - v.buyIn) / 100)}.`;
  $('#f-calc').innerHTML = calc;
  const same = isISO(v.date) && v.type ? sameDay(v.date, v.type, editing) : null;
  $('#f-same').textContent = same ? `You already have a ${same.type} session on ${fmtDate(v.date)}. Saving ${editing ? 'keeps both' : 'adds another one'}.` : '';
}
function saveSession() {
  const v = readForm(), err = $('#f-err');
  const fail = m => { err.textContent = m; return false; };
  if (!isISO(v.date)) return fail('Enter the date of the session.');
  if (!v.type) return fail('Enter a session type, like Home game.');
  if (v.buyIn == null) return fail('Enter your total buy-in for the session, like 15. Include every rebuy.');
  if (v.stack == null) return fail('Enter your stack at the end of the session, like 17.25. Enter 0 if you lost it all.');
  const known = typeInfo().get(key(v.type));
  const type = known ? known.name : v.type;   // keep one spelling per session type
  let msg;
  if (editing) {
    const s = S.sessions.find(x => x.id === editing);
    Object.assign(s, { date: v.date, type, buyIn: v.buyIn, stack: v.stack });
    delete s.mins;
    if (v.notes) s.notes = v.notes; else delete s.notes;
    msg = `Session updated. Net ${usdC(net(s), true)}.`;
  } else {
    const s = { id: uid(), seq: ++S.seq, date: v.date, type, buyIn: v.buyIn, stack: v.stack };
    if (v.notes) s.notes = v.notes;
    if (endingLive && S.live) { if (S.live.hands.length) s.hands = S.live.hands; S.live = null; tab = 'home'; liveSel = null; liveMsg = ''; }
    S.sessions.push(s);
    msg = `Session ${endingLive ? 'saved' : 'added'}. Net ${usdC(net(s), true)}.`;
  }
  const wasLive = endingLive; endingLive = false;
  const lgSel = $('#f-league'), toLg = !editing && lgSel && lgSel.value ? S.leagues.find(l => l.code === lgSel.value) : null;
  if (toLg && !toLg.type) toLg.type = type;   // remember which game this league is for
  save(); closeSheet(); render(); toast(msg);
  if (toLg) {
    const dup = S.league && toLg.code === S.league.code && LGD.results.some(r => r.uid === LGD.uid && r.date === v.date);
    if (v.buyIn > MAX_C || v.stack > MAX_C) toast('Saved on your phone. Amounts over $100,000 can’t be added to a league.');
    else if (dup) toast(`${msg} You already have a result for that night in ${toLg.name}, so it wasn’t added again. Add it from the League tab if it was a second game.`);
    else lgWrite(be => be.addResult(toLg.code, { date: v.date, buyIn: v.buyIn, cashOut: v.stack, player: toLg.player }), `${msg} Added to ${toLg.name}.`);
  }
  if (wasLive) { window.scrollTo(0, 0); syncWakeLock(); }
  return true;
}

/* ---------------- toast ---------------- */
let toastTimer = null, undoFn = null;
function toast(msg, undo) {

function parseCSV(text) {

  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {

      else fld += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(fld); fld = ''; }

}

}

  const need = ['date', 'ending_stack', 'session_type'];
  const miss = need.filter(k => !has(k)).concat(has('total_buy_in') || legacy ? [] : ['total_buy_in']);
  if (miss.length) throw new Error(`This doesn’t look like a session log. It’s missing the ${miss.join(', ')} column${miss.length > 1 ? 's' : ''}. Files exported from this app will work.`);
  const ix = Object.fromEntries(['date', 'ending_stack', 'session_type', 'total_buy_in', 'buy_in_amount', 'num_buy_ins', 'notes', 'session_id'].map(k => [k, head.indexOf(k)]));

      if (each != null && Number.isInteger(n) && n >= 1) buyIn = each * n;

    const it = { date, type, stack, buyIn };
    const notes = String(ix.notes >= 0 && r[ix.notes] != null ? r[ix.notes] : '').trim();

function handleImportText(text, name) {

  const head0 = rows0.length ? rows0[0].map(h => h.trim().toLowerCase().replace(/\s+/g, '_')) : [];

  <div class="sheet-body">
    <p>Found ${items.length} session${items.length === 1 ? '' : 's'} in ${esc(name)}.${already ? ` ${already} ${already === 1 ? 'is' : 'are'} already in the app.` : ''}${esc(rowsNote(bad, dupes))}</p>

    </div>

}

    sortedAsc().map(s => [s.date, q(s.type), d(totalIn(s)), d(s.stack), d(net(s)), q(s.notes || ''), s.id].join(',')).join('\n') + '\n';

const nv = s => net(s) / 100;   // a session's result in dollars
const fv = (v, sign = false) => usd(v, sign);

const axV = (v, step) => axMoney(v, step);
function stats(rows) {
  const v = rows.map(s => nv(s)), n = v.length;

  const total = rows.reduce((a, s) => a + nv(s), 0);
  const mean = total / n;
  const sd = n > 1 ? Math.sqrt(v.reduce((a, x) => a + (x - mean) ** 2, 0) / (n - 1)) : NaN;
  return { n, wins, rate: wins / n, total, mean, sd };
}

  for (let i = 0; i < pts.length; i++) {
    const p = pts[i], q = pts[i + 1];
    pos.push([p.t, Math.max(p.v, 0)]); neg.push([p.t, Math.min(p.v, 0)]);
    if (q && ((p.v > 0 && q.v < 0) || (p.v < 0 && q.v > 0))) {
      const tc = p.t + (q.t - p.t) * (p.v / (p.v - q.v));
      pos.push([tc, 0]); neg.push([tc, 0]);
    }
  }
  const y0 = f1(y(0));
  const poly = a => `M${f1(x(a[0][0]))},${y0}` + a.map(([t, v]) => `L${f1(x(t))},${f1(y(v))}`).join('') + `L${f1(x(a[a.length - 1][0]))},${y0}Z`;
  return { pos: poly(pos), neg: poly(neg) };
}
const linePath = (pts, x, y) => 'M' + pts.map(p => `${f1(x(p.t))},${f1(y(p.v))}`).join('L');
function zeroLine(F) { return F.lo < 0 && F.hi > 0 || F.lo === 0 ? `<line class="zero" x1="${F.m.l}" x2="${F.W - F.m.r}" y1="${f1(F.y(0))}" y2="${f1(F.y(0))}"/>` : ''; }
// A line that is green above zero and red below it, with a soft fill that fades toward the zero line.
function signedSeries(F, pts, label) {
  const id = 'g' + (++gradSeq), top = F.m.t, bot = F.H - F.m.b, z = Math.min(bot, Math.max(top, F.y(0)));
  const off = ((z - top) / ((bot - top) || 1)).toFixed(4);
  const defs = `<linearGradient id="${id}s" gradientUnits="userSpaceOnUse" x1="0" x2="0" y1="${top}" y2="${bot}">${stop(off, '--win')}${stop(off, '--loss')}</linearGradient>
    <linearGradient id="${id}p" gradientUnits="userSpaceOnUse" x1="0" x2="0" y1="${top}" y2="${Math.max(z, top + 1)}">${stop(0, '--win', 0.34)}${stop(1, '--win', 0.03)}</linearGradient>
    <linearGradient id="${id}n" gradientUnits="userSpaceOnUse" x1="0" x2="0" y1="${Math.min(z, bot - 1)}" y2="${bot}">${stop(0, '--loss', 0.03)}${stop(1, '--loss', 0.34)}</linearGradient>`;
  const fp = fillPaths(pts, F.x, F.y), last = pts[pts.length - 1];
  const body = `<path d="${fp.pos}" fill="url(#${id}p)"/><path d="${fp.neg}" fill="url(#${id}n)"/>` + zeroLine(F) +
    `<path class="ln" stroke="url(#${id}s)" d="${linePath(pts, F.x, F.y)}"/>` +
    `<circle class="end-dot ${last.v < 0 ? 'neg-f' : 'pos-f'}" cx="${f1(F.x(last.t))}" cy="${f1(F.y(last.v))}" r="4"/>`;
  return svgWrap(F.W, F.H, F.under + body + F.axes, label, defs);
}

// Tap or drag across a dated chart to read individual points.
function inspectTime(fig, pts, F, describe, colorOf = p => p.v < 0 ? 'neg-s' : 'pos-s') {
  const svg = fig.querySelector('svg'), hov = svg.querySelector('.hov'), out = fig.querySelector('.readout');
  const px = pts.map(p => F.x(p.t));
  out.innerHTML = fig.classList.contains('compact') ? 'Tap or drag the chart for details.' : 'Tap or drag across the chart to see individual sessions.';
  const show = e => {
    const r = svg.getBoundingClientRect(), sx = (e.clientX - r.left) * (F.W / r.width);
    let bi = 0, bd = Infinity;
    px.forEach((v, i) => { const d = Math.abs(v - sx); if (d <= bd) { bd = d; bi = i; } });
    const p = pts[bi], cx = f1(px[bi]), cy = f1(F.y(p.v));
    hov.innerHTML = `<line class="guide" x1="${cx}" x2="${cx}" y1="${F.m.t}" y2="${F.H - F.m.b}"/><circle class="hdot ${colorOf(p)}" cx="${cx}" cy="${cy}" r="5"/>`;
    out.innerHTML = describe(p);
  };
  svg.addEventListener('pointerdown', show);
  svg.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons) show(e); });
}

function drawCum(fig, rows) {
  const el = fig.querySelector('.chart');
  let c = 0;
  const pts = rows.map(s => { c += nv(s); return { t: tms(s.date), v: c, s }; });
  const vs = pts.map(p => p.v);
  const F = timeFrame(el, pts, Math.min(0, ...vs), Math.max(0, ...vs));
  el.innerHTML = signedSeries(F, pts, 'Cumulative profit and loss over time');
  inspectTime(fig, pts, F, p => `<b>${fmtDate(p.s.date)}</b>, ${esc(p.s.type)}<br>Session ${fvHTML(nv(p.s))}, running total ${fvHTML(p.v)}`);
}

function drawHist(fig, rows) {
  const el = fig.querySelector('.chart'), out = fig.querySelector('.readout');
  const v = rows.map(s => nv(s));
  let lo = Math.min(...v), hi = Math.max(...v);
  if (lo === hi) { lo -= 0.5; hi += 0.5; }
  const B = 15, edges = Array.from({ length: B + 1 }, (_, i) => lo + (hi - lo) * i / B), counts = new Array(B).fill(0);
  for (const x of v) {
    let i = Math.floor((x - lo) / (hi - lo) * B);
    if (i > 0 && x < edges[i]) i--;
    if (i < B - 1 && x >= edges[i + 1]) i++;
    counts[Math.min(B - 1, Math.max(0, i))]++;
  }
  const mean = v.reduce((a, b) => a + b, 0) / v.length;
  const { W, H } = chartSize(el);
  const maxC = Math.max(...counts), top = maxC * 1.18;
  const yt = niceTicks(0, top, 4, 1);
  const yticks = yt.ticks.filter(t => t <= top + 1e-9);
  const m = { t: 10, r: 6, b: 24, l: Math.ceil(Math.max(...yticks.map(t => tw(String(t), 11)))) + 10 };
  const [x0, x1] = padRange(lo, hi, 0.03);
  const x = lin(x0, x1, m.l, W - m.r), y = lin(0, top, H - m.b, m.t);
  const xt = niceTicks(x0, x1, Math.max(2, Math.floor((W - m.l - m.r) / 56)));
  let g = yticks.filter(t => t > 0).map(t => `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${f1(y(t))}" y2="${f1(y(t))}"/>`).join('');
  g += `<line class="zero" x1="${m.l}" x2="${W - m.r}" y1="${f1(y(0))}" y2="${f1(y(0))}"/>`;
  g += counts.map((n, i) => {
    if (!n) return '';
    const xa = x(edges[i]) + 1, xb = x(edges[i + 1]) - 1, mid = (edges[i] + edges[i + 1]) / 2;
    const cls = edges[i + 1] <= 0 ? 'neg-f' : edges[i] >= 0 ? 'pos-f' : mid < 0 ? 'neg-f' : 'pos-f';
    const h = y(0) - y(n), r = Math.min(4, (xb - xa) / 2, h);
    return `<path class="hist-bar ${cls}" d="M${f1(xa)},${f1(y(0))}V${f1(y(n) + r)}Q${f1(xa)},${f1(y(n))} ${f1(xa + r)},${f1(y(n))}H${f1(xb - r)}Q${f1(xb)},${f1(y(n))} ${f1(xb)},${f1(y(n) + r)}V${f1(y(0))}Z"/>`;
  }).join('');
  const mx = x(mean), label = `Average ${fv(mean, true)}`, lw = tw(label, 11) + 16;
  g += `<line class="mean" x1="${f1(mx)}" x2="${f1(mx)}" y1="${m.t + 22}" y2="${H - m.b}"/>`;
  const lx = Math.min(W - m.r - lw, Math.max(m.l, mx - lw / 2));
  g += `<rect class="pill" x="${f1(lx)}" y="${m.t}" width="${f1(lw)}" height="20" rx="10"/><text class="pill-t" x="${f1(lx + lw / 2)}" y="${m.t + 10}" dy=".35em" text-anchor="middle">${label}</text>`;
  let axes = yticks.map(t => `<text class="axl" x="${m.l - 8}" y="${f1(y(t))}" dy=".34em" text-anchor="end">${t}</text>`).join('');
  axes += xt.ticks.filter(t => t >= x0 && t <= x1).map(t => `<text class="axl" x="${f1(x(t))}" y="${H - 6}" text-anchor="middle">${axV(t, xt.step)}</text>`).join('');
  el.innerHTML = svgWrap(W, H, g + axes, 'Histogram of session results');
  out.innerHTML = 'Tap a bar to see its range.';
  const svg = el.querySelector('svg'), hov = svg.querySelector('.hov');
  const show = e => {
    const r = svg.getBoundingClientRect(), sx = (e.clientX - r.left) * (W / r.width);
    let i = edges.findIndex((ed, k) => k < B && sx >= x(ed) && sx < x(edges[k + 1]));
    if (i < 0) i = sx < x(lo) ? 0 : B - 1;
    hov.innerHTML = `<rect class="hsel" x="${f1(x(edges[i]))}" y="${m.t}" width="${f1(x(edges[i + 1]) - x(edges[i]))}" height="${H - m.t - m.b}" rx="4"/>`;
    const n = counts[i];
    out.innerHTML = `<b>${n} session${n === 1 ? '' : 's'}</b> from ${fv(edges[i])} to ${fv(edges[i + 1])}<br>Average of all sessions ${fvHTML(mean)}`;
  };
  svg.addEventListener('pointerdown', show);
  svg.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons) show(e); });
}

function groupByType(rows) {
  const g = new Map();
  for (const s of rows) {
    const k = key(s.type), e = g.get(k) || { name: '', vals: [], sum: 0 };
    e.name = s.type.trim(); e.vals.push(nv(s)); e.sum += nv(s);
    g.set(k, e);
  }
  return [...g.values()];
}
// Rows with the name on top and the mark underneath, sharing one horizontal scale.
function categoryFrame(el, n, dmin, dmax, rowH, padL = 0, padR = 0) {
  const W = Math.max(240, Math.round(el.clientWidth || 320));
  const m = { t: 2, r: 6 + padR, b: 24, l: 4 + padL };
  const H = m.t + m.b + rowH * n;
  const [lo, hi] = padRange(dmin, dmax, 0.04);
  const x = lin(lo, hi, m.l, W - m.r);
  const xt = niceTicks(lo, hi, Math.max(2, Math.floor((W - m.l - m.r) / 60)));
  const ticks = xt.ticks.filter(t => t >= lo && t <= hi);
  const under = ticks.filter(t => Math.abs(t) > xt.step * 1e-6).map(t => `<line class="grid" y1="${m.t}" y2="${H - m.b}" x1="${f1(x(t))}" x2="${f1(x(t))}"/>`).join('');
  const axes = ticks.map(t => { const w2 = tw(axV(t, xt.step), 11) / 2, cx = Math.min(W - 2 - w2, Math.max(2 + w2, x(t))); return `<text class="axl" x="${f1(cx)}" y="${H - 6}" text-anchor="middle">${axV(t, xt.step)}</text>`; }).join('');
  const row = i => m.t + rowH * i;
  const zero = lo < 0 && hi > 0 ? `<line class="zero" y1="${m.t}" y2="${H - m.b}" x1="${f1(x(0))}" x2="${f1(x(0))}"/>` : '';
  return { W, H, m, x, row, under, axes, zero, lo, hi };
}
function drawByType(fig, rows) {
  const el = fig.querySelector('.chart');
  const list = groupByType(rows).sort((a, b) => b.sum - a.sum || a.name.localeCompare(b.name));
  const sums = list.map(e => e.sum), labels = sums.map(v => fv(v, true));
  const padR = Math.max(0, ...sums.map((v, i) => v >= 0 ? tw(labels[i], 12) + 10 : 0));
  const padL = Math.max(0, ...sums.map((v, i) => v < 0 ? tw(labels[i], 12) + 10 : 0));
  const RH = 54, F = categoryFrame(el, list.length, Math.min(0, ...sums), Math.max(0, ...sums), RH, padL, padR);
  let g = F.under + F.zero;
  list.forEach((e, i) => {
    const v = sums[i], y0 = F.row(i), by = y0 + 24, bh = 20;
    const xa = F.x(Math.min(0, v)), xb = F.x(Math.max(0, v)), w = Math.max(2, xb - xa);
    g += `<text class="lab" x="4" y="${f1(y0 + 14)}">${esc(fitText(e.name, F.W - 8, 13))}</text>`;
    g += `<rect class="${v < 0 ? 'neg-f' : 'pos-f'}" x="${f1(v < 0 ? xb - w : xa)}" y="${f1(by)}" width="${f1(w)}" height="${bh}" rx="5"/>`;
    g += `<text class="val ${v < 0 ? 'tneg' : v > 0 ? 'tpos' : ''}" x="${f1(v < 0 ? F.x(v) - 6 : F.x(v) + 6)}" y="${f1(by + bh / 2)}" dy=".35em" text-anchor="${v < 0 ? 'end' : 'start'}">${labels[i]}</text>`;
  });
  el.innerHTML = svgWrap(F.W, F.H, g + F.axes, 'Total profit and loss by session type');
  const out = fig.querySelector('.readout');
  out.innerHTML = list.length > 1 ? 'Tap a bar for details.' : '';
  const svg = el.querySelector('svg'), hov = svg.querySelector('.hov');
  svg.addEventListener('pointerdown', e => {
    const r = svg.getBoundingClientRect(), sy = (e.clientY - r.top) * (F.H / r.height);
    const i = Math.max(0, Math.min(list.length - 1, Math.floor((sy - F.m.t) / RH)));
    const it = list[i], n = it.vals.length;
    hov.innerHTML = `<rect class="hsel" x="0" y="${f1(F.row(i))}" width="${F.W}" height="${RH}" rx="8"/>`;
    out.innerHTML = `<b>${esc(it.name)}</b>: ${fvHTML(it.sum)} over ${n} session${n === 1 ? '' : 's'}<br>Average ${fvHTML(it.sum / n)} per session`;
  });
}

function drawDD(fig, rows) {
  const el = fig.querySelector('.chart');
  let c = 0, peak = -Infinity;
  const pts = rows.map(s => { c += nv(s); peak = Math.max(peak, c); return { t: tms(s.date), v: c - peak, s, c }; });
  const minDD = Math.min(...pts.map(p => p.v));
  $('#dd-stats tbody').innerHTML = `<tr><td>Peak cumulative profit</td><td>${fvHTML(peak)}</td></tr>
    <tr><td>Maximum drawdown</td><td>${fv(-minDD)}</td></tr><tr><td>Current drawdown</td><td>${fv(-pts[pts.length - 1].v)}</td></tr>`;
  const F = timeFrame(el, pts, minDD, 0);
  const id = 'g' + (++gradSeq), y0 = f1(F.y(0)), bot = F.H - F.m.b;
  const defs = `<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="0" x2="0" y1="${y0}" y2="${bot}">${stop(0, '--loss', 0.05)}${stop(1, '--loss', 0.36)}</linearGradient>`;
  const area = `M${f1(F.x(pts[0].t))},${y0}` + pts.map(p => `L${f1(F.x(p.t))},${f1(F.y(p.v))}`).join('') + `L${f1(F.x(pts[pts.length - 1].t))},${y0}Z`;
  let mark = '';
  if (minDD < -0.004) {
    const low = pts.find(p => p.v === minDD), lx = F.x(low.t), ly = F.y(low.v), label = `Max ${fv(minDD)}`, lw = tw(label, 11) + 16;
    const bx = Math.min(F.W - F.m.r - lw, Math.max(F.m.l, lx - lw / 2)), byy = ly + 10 + 20 <= bot ? ly + 10 : ly - 30;
    mark = `<circle class="end-dot neg-f" cx="${f1(lx)}" cy="${f1(ly)}" r="4"/><rect class="pill" x="${f1(bx)}" y="${f1(byy)}" width="${f1(lw)}" height="20" rx="10"/><text class="pill-t" x="${f1(bx + lw / 2)}" y="${f1(byy + 10)}" dy=".35em" text-anchor="middle">${label}</text>`;
  }
  el.innerHTML = svgWrap(F.W, F.H, F.under + `<path d="${area}" fill="url(#${id})"/><line class="zero" x1="${F.m.l}" x2="${F.W - F.m.r}" y1="${y0}" y2="${y0}"/><path class="ln dd-line" d="${linePath(pts, F.x, F.y)}"/>` + mark + F.axes, 'Drawdown from peak over time', defs);
  inspectTime(fig, pts, F, p => `<b>${fmtDate(p.s.date)}</b>, ${esc(p.s.type)}<br>${p.v < -0.004 ? `${fv(-p.v)} below the peak` : 'At the peak'}, running total ${fvHTML(p.c)}`, () => 'neg-s');
}

const DRAW = { cum: drawCum, hist: drawHist, type: drawByType, dd: drawDD };
let lastRows = null, lastWidth = 0;
function drawCharts(rows) {
  lastRows = rows;
  document.querySelectorAll('[data-chart]').forEach(el => {
    const fig = el.closest('figure');
    try { DRAW[el.dataset.chart](fig, rows); }
    catch (e) { el.innerHTML = '<p class="note">This chart couldn’t be drawn.</p>'; console.error(e); }
  });
  lastWidth = window.innerWidth;
}

/* ---------------- events ---------------- */
const A = {
  tab: t => setTab(t.dataset.tab),
  edit: t => openSessionForm(t.dataset.id),
  close: () => closeSheet(),
  'save-session': () => saveSession(),
  'delete-session': () => {
    const s = S.sessions.find(x => x.id === editing); if (!s) return;
    const snap = snapshot();
    S.sessions = S.sessions.filter(x => x.id !== editing);
    save(); closeSheet(); render();
    toast(`Deleted ${s.type} on ${fmtDate(s.date)}.`, () => restore(snap));
  },
  chip: t => {
    $('#f-type').value = t.dataset.name; pickLeagueFor(t.dataset.name);
    updateForm();
  },
  settings: () => openSettings(),
  theme: t => { S.settings.theme = t.dataset.v; save(); applyTheme(); document.querySelectorAll('.seg [data-a="theme"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S.settings.theme))); },
  import: () => { const fi = $('#file-in'); fi.value = ''; fi.click(); },
  export: () => exportCSV(),
  'copy-csv': async () => { const ok = await copyText(toCSV()); toast(ok ? `Copied ${S.sessions.length} sessions as CSV text. Paste it into Notes to keep a backup.` : 'Couldn’t copy. Try Export sessions instead.'); },
  'paste-csv': () => openSheet(`<div class="sheet-head"><button class="link" data-a="close">Cancel</button><h2>Paste CSV text</h2><button class="link strong" data-a="do-paste">Import</button></div>
    <div class="sheet-body"><p class="muted small">Paste CSV text, such as a copy made with Copy as text. The first line should be the column names.</p>
    <textarea id="paste-box" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="CSV text" placeholder="date,session_type,total_buy_in,ending_stack,net_profit"></textarea></div>`, { backdropCloses: false }),
  'do-paste': () => { const v = $('#paste-box').value; if (!v.trim()) { $('#paste-box').focus(); return; } handleImportText(v, 'the pasted text'); },
  'import-merge': () => { if (!pendingImport) return; const snap = snapshot(), n = pendingImport.fresh.length; addItems(pendingImport.fresh); pendingImport = null; save(); closeSheet(); render(); toast(`Added ${n} session${n === 1 ? '' : 's'}.`, () => restore(snap)); },
  'import-replace': () => { if (!pendingImport) return; const snap = snapshot(), n = pendingImport.items.length; S.sessions = []; S.seq = 0; addItems(pendingImport.items); pendingImport = null; save(); closeSheet(); render(); toast(`Replaced with ${n} session${n === 1 ? '' : 's'}.`, () => restore(snap)); },
  erase: () => openSheet(`<div class="sheet-head"><button class="link" data-a="close">Cancel</button><h2>Erase all sessions</h2><span></span></div>
    <div class="sheet-body"><p>This removes all ${S.sessions.length} sessions and their recorded hands from this device. Export them first if you want a copy.</p>
    <div class="stack-btns"><button class="btn danger" data-a="erase-confirm">Erase ${S.sessions.length} sessions</button><button class="btn" data-a="close">Keep my sessions</button></div></div>`),
  'erase-confirm': () => { const snap = snapshot(); S.sessions = []; S.seq = 0; save(); closeSheet(); render(); toast('Erased all sessions.', () => restore(snap)); },
  'clear-filters': () => { S.settings.filters = { type: '', start: '', end: '' }; save(); render(); },
  jump: t => { const el = document.getElementById(t.dataset.to); if (el) el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); },
  undo: () => { const fn = undoFn; undoFn = null; $('#toast').hidden = true; if (fn) { fn(); toast('Undone.'); } },
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]');
  if (t && A[t.dataset.a] && !t.disabled) { e.preventDefault(); A[t.dataset.a](t, e); }
});
$('#backdrop').addEventListener('click', e => { if (e.target.id === 'backdrop' && sheetCloseOnBackdrop) closeSheet(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#backdrop').hidden) { closeSheet(); return; }
  if (e.key === 'Enter' && e.target.matches('tr[data-a="detail"]')) { e.preventDefault(); e.target.click(); return; }
  if (e.key === 'Enter' && e.target.closest('#sf') && e.target.tagName === 'INPUT') {
    e.preventDefault();
    const order = ['f-type', 'f-buyin', 'f-stack'], i = order.indexOf(e.target.id);
    if (i >= 0 && i < order.length - 1) $('#' + order[i + 1]).focus(); else saveSession();
  }
  if (e.key === 'Enter' && e.target.id === 'bi-amt') { e.preventDefault(); A['bi-add'](); }
  if (e.key === 'Enter' && (e.target.id === 'ls-buyin' || e.target.id === 'ls-type')) { e.preventDefault(); if (e.target.id === 'ls-type') $('#ls-buyin').focus(); else A['live-start'](); }
  if (e.key === 'Enter' && e.target.matches('tr[data-a="hand-edit"]')) { e.preventDefault(); e.target.click(); }
});
let notesT = null;
document.addEventListener('input', e => {
  if (e.target.id === 'f-type') pickLeagueFor(e.target.value);
  if (e.target.id === 'lf-q') { listQ = e.target.value; $('#list-body').innerHTML = listBody(); }
  if (e.target.id === 'live-notes' && S.live) { S.live.notes = e.target.value.slice(0, 2000); clearTimeout(notesT); notesT = setTimeout(save, 400); }
  if (e.target.closest && e.target.closest('#sf')) updateForm();
  if (e.target.id === 'ls-type') document.querySelectorAll('[data-a="live-chip"]').forEach(c => c.setAttribute('aria-pressed', String(key(c.dataset.name) === key(e.target.value))));
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'flt-type' || id === 'flt-start' || id === 'flt-end') {
    const st = $('#flt-start').value, en = $('#flt-end').value;
    S.settings.filters = { type: $('#flt-type').value, start: isISO(st) ? st : '', end: isISO(en) ? en : '' };
    save(); renderResults();
  } else if (id === 'f-date') updateForm();
  else if (id === 'f-league') lgPicked = true;
  else if (id === 'lf-type') { listType = e.target.value; $('#list-body').innerHTML = listBody(); }
  else if (id === 'cb-colors') { S.settings.cb = e.target.checked; save(); applyTheme(); if (tab === 'analytics' || tab === 'home') render(); }
  else if (id === 'lg-type' && S.league) { const l = S.league; if (e.target.value) l.type = e.target.value; else delete l.type; save(); toast(e.target.value ? `${l.name} is now linked to ${e.target.value}.` : `${l.name} isn’t linked to a session type.`); }

const RANKS = 'AKQJT98765432';

const seatsFor = n => [...(MIDDLE[n - 3] || []), 'BTN', 'SB', 'BB'];
const ALL_SEATS = new Set(['UTG', 'UTG+1', 'UTG+2', 'UTG+3', 'LJ', 'HJ', 'CO', 'BTN', 'SB', 'BB']);
const SEAT_NAMES = { UTG: 'under the gun', 'UTG+1': 'UTG+1', 'UTG+2': 'UTG+2', 'UTG+3': 'UTG+3', LJ: 'lojack', HJ: 'hijack', CO: 'cutoff', BTN: 'button', SB: 'small blind', BB: 'big blind' };

const GROUPS = [['early', 'Early (UTG)'], ['middle', 'Middle (LJ, HJ)'], ['late', 'Late (CO, BTN)'], ['blinds', 'Blinds (SB, BB)']];

const handKind = h => h.length === 2 ? 'pair' : h[2] === 's' ? 'suited' : 'offsuit';
const pct = (x, d = 1) => (x * 100).toFixed(d) + '%';
function normHand(v) {
  v = String(v || '').trim().replace(/10/g, 'T').replace(/\s+/g, '');

  const m = /^([AKQJT2-9])([AKQJT2-9])([so])?$/i.exec(v);

}

    .map(x => { const o = { h: x.h, a: x.a, t: Number.isFinite(x.t) ? x.t : 0 }; if (ALL_SEATS.has(x.p)) o.p = x.p; if ((x.r === 'w' || x.r === 'l') && x.a !== 'f') o.r = x.r; return o; });

// Made-up sessions and hands for trying the app out. They're marked so they can be removed without touching real sessions.
function addSamples() {
  let seed = 1001;
  const rnd = () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const normal = () => Math.sqrt(-2 * Math.log(1 - rnd())) * Math.cos(2 * Math.PI * rnd());
  const pick = a => a[Math.floor(rnd() * a.length)];
  const games = [
    { type: 'Friday Home Game', stake: 2000, edge: 0.18, swing: 1.0, w: 5, step: 25 },
    { type: 'Casino 1/2 No-Limit', stake: 20000, edge: 0.08, swing: 0.85, w: 2, step: 100 },
    { type: 'League Night', stake: 1000, edge: -0.04, swing: 1.25, w: 3, step: 25 },
  ];
  const notes = ['Ran well early, gave some back late.', 'Tough table with lots of re-raising.', 'Card dead most of the night.',
    'Doubled up with a set against top pair.', 'New player at the table, very loose.', 'Stayed patient after a bad beat.', 'Lost a big flip near the end.'];
  const weighted = games.flatMap(g => Array(g.w).fill(g));
  const list = [];
  const today = new Date(); today.setHours(0, 0, 0, 0);
  for (let d = 180; d >= 1; d -= 2 + Math.floor(rnd() * 5)) {
    const day = new Date(today.getTime() - d * DAY), date = iso(day.getFullYear(), day.getMonth() + 1, day.getDate());
    const g = pick(weighted), n = 1 + (rnd() < 0.35 ? 1 : 0) + (rnd() < 0.12 ? 1 : 0);
    const buyIn = g.stake * n, netC = Math.round((g.edge + g.swing * normal()) * g.stake / g.step) * g.step;
    const s = { date, type: g.type, buyIn, stack: Math.max(0, buyIn + netC), sample: true, start: day.getTime() + 19 * 36e5 };
    if (rnd() < 0.3) s.notes = pick(notes);
    list.push(s);
  }
  // one evening with two games
  const two = list[list.length - 9];
  list.splice(list.length - 8, 0, { date: two.date, type: 'League Night', buyIn: 1000, stack: 1650, sample: true, start: two.start + 4 * 36e5, notes: 'Second game of the night.' });
  // hands for the most recent sessions, with positions at an 8-player table
  const chen = (i, j, suited) => {
    const v = k => [10, 8, 7, 6][k] !== undefined ? [10, 8, 7, 6][k] : (14 - k) / 2;
    if (i === j) return Math.max(5, v(i) * 2);
    const gap = j - i - 1;
    return v(i) + (suited ? 2 : 0) - [0, 1, 2, 4][Math.min(gap, 3)] - (gap > 3 ? 1 : 0) + (gap <= 1 && i > 2 ? 1 : 0);
  };
  const raiseAt = { early: 8, middle: 7, late: 5.5, blinds: 7 };
  for (const s of list.slice(-10)) {
    const hands = [], count = 40 + Math.floor(rnd() * 50);
    let seat = pick(seatsFor(8)), t = s.start;
    for (let k = 0; k < count; k++) {
      const c1 = Math.floor(rnd() * 52); let c2 = c1; while (c2 === c1) c2 = Math.floor(rnd() * 52);
      const r1 = Math.floor(c1 / 4), r2 = Math.floor(c2 / 4), i = Math.min(r1, r2), j = Math.max(r1, r2), suited = c1 % 4 === c2 % 4;
      const h = i === j ? handName(i, i) : suited ? handName(i, j) : handName(j, i);
      const sc = chen(i, j, suited) + (rnd() - 0.5) * 2.5, rt = raiseAt[posGroup(seat)];
      let a = 'f';
      if (sc >= rt) a = rnd() < 0.85 ? 'r' : 'c';
      else if (sc >= rt - 2) a = rnd() < 0.4 ? 'c' : 'f';
      else if (seat === 'BB') a = rnd() < 0.55 ? 'k' : 'f';
      else if (rnd() < 0.03) a = 'c';
      t += (90 + rnd() * 120) * 1000;
      const rec = { h: rnd() < 0.03 ? '' : h, a, t, p: seat };
      if (a !== 'f' && rnd() < 0.9) rec.r = rnd() < Math.min(0.75, Math.max(0.2, 0.3 + sc * 0.025 + (a === 'r' ? 0.06 : 0))) ? 'w' : 'l';
      hands.push(rec);
      seat = nextSeat(seat, 8);
    }
    s.hands = hands;
  }
  for (const s of list) { delete s.start; S.sessions.push({ ...s, id: uid(), seq: ++S.seq }); }
  return { n: list.length, hands: list.reduce((a, s) => a + (s.hands ? s.hands.length : 0), 0) };
}

// Shared league results live in Firebase (Firestore). Personal sessions and hands never leave this phone.
// Firebase settings come from firebase-config.js, which sets window.FELT_FIREBASE.
const FB_VERSION = '10.12.2';
const LG_CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const REACTIONS = ['🔥', '😂', '😭', '🐐', '💀', '🃏'];

// Firebase connection, loaded only when the league is used.
let fbConn = null;
async function fbBackend() {
  if (fbConn) return fbConn;
  const base = `https://www.gstatic.com/firebasejs/${FB_VERSION}/`;
  const [appM, authM, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  const app = appM.initializeApp(window.FELT_FIREBASE);
  let db;
  try { db = F.initializeFirestore(app, { localCache: F.persistentLocalCache() }); } catch (e) { db = F.getFirestore(app); }
  const auth = authM.getAuth(app);
  const user = await new Promise((res, rej) => {
    const off = authM.onAuthStateChanged(auth, u => { if (u) { off(); res(u); } });
    if (!auth.currentUser) authM.signInAnonymously(auth).catch(e => { off(); rej(e); });
  });

  fbConn = {
    uid: user.uid,
    async getLeague(code) { const d = await F.getDoc(L(code)); return d.exists() ? { code, ...d.data() } : null; },
    async createLeague(code, name) { await F.setDoc(L(code), { name, createdBy: user.uid, createdAt: F.serverTimestamp() }); },
    async setMember(code, name) { await F.setDoc(F.doc(db, 'leagues', code, 'members', user.uid), { name, joinedAt: F.serverTimestamp() }); },
    async removeMember(code) { await F.deleteDoc(F.doc(db, 'leagues', code, 'members', user.uid)); },
    async addResult(code, r) { await F.addDoc(F.collection(db, 'leagues', code, 'results'), { ...r, uid: user.uid, reactions: {}, createdAt: F.serverTimestamp() }); },
    async updateResult(code, id, r) { await F.updateDoc(F.doc(db, 'leagues', code, 'results', id), r); },
    async deleteResult(code, id) { await F.deleteDoc(F.doc(db, 'leagues', code, 'results', id)); },
    async renamePlayer(code, ids, name) {
      for (let i = 0; i < ids.length; i += 10) { const b = F.writeBatch(db); ids.slice(i, i + 10).forEach(id => b.update(F.doc(db, 'leagues', code, 'results', id), { player: name })); await b.commit(); }
    },
    async deleteResults(code, ids) {
      for (let i = 0; i < ids.length; i += 10) { const b = F.writeBatch(db); ids.slice(i, i + 10).forEach(id => b.delete(F.doc(db, 'leagues', code, 'results', id))); await b.commit(); }
    },
    // Organizer only: results first, then members, then the league itself (the rules check the league to confirm the organizer).
    async deleteLeague(code, resultIds, memberIds) {
      await this.deleteResults(code, resultIds);
      for (let i = 0; i < memberIds.length; i += 10) { const b = F.writeBatch(db); memberIds.slice(i, i + 10).forEach(id => b.delete(F.doc(db, 'leagues', code, 'members', id))); await b.commit(); }
      await F.deleteDoc(L(code));
    },
    async react(code, id, emoji) { await F.updateDoc(F.doc(db, 'leagues', code, 'results', id), { [`reactions.${user.uid}`]: emoji || F.deleteField() }); },
    watch(code, cb, onErr) {
      const offs = [
        F.onSnapshot(L(code), d => cb('league', d.exists() ? { code, ...d.data() } : null), onErr),
        F.onSnapshot(F.collection(db, 'leagues', code, 'members'), q => cb('members', q.docs.map(d => ({ id: d.id, ...d.data() }))), onErr),
        F.onSnapshot(F.collection(db, 'leagues', code, 'results'), q => cb('results', q.docs.map(d => ({ id: d.id, ...d.data() }))), onErr),
      ];
      return () => offs.forEach(f => f());
    },
  };
  return fbConn;
}
